<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui" style="display: none;">
        <div id="exp-bar-container"><div id="exp-fill"></div></div>
        <div id="timer-container">00:00</div>
        
        <div id="boss-hp-container" style="display: none;">
            <div id="boss-name"></div>
            <div class="boss-hp-bar-outer">
                <div id="boss-hp-fill"></div>
            </div>
        </div>

        <div id="ui">
            <div class="player-name">藍色方塊</div>
            <div class="hp-bar-outer"><div id="hp-fill"></div></div>
            <div>等級: <span id="lvl">1</span> | 擊殺: <span id="kills">0</span></div>
        </div>
    </div>

    <div id="home-screen">
        <div class="top-bar">
            <div class="currency">💰 <span id="total-gold">0</span></div>
        </div>

        <div id="content-area">
            <div id="tab-battle" class="tab-content">
                <div class="title-container">
                    <h1 class="game-title">戰役</h1>
                    <label class="switch-wrapper">
                        <span class="switch-label">試煉模式</span>
                        <div class="switch">
                            <input type="checkbox" id="trial-mode-toggle">
                            <span class="slider round"></span>
                        </div>
                    </label>
                </div>
                
                <div class="stage-card">
                    <div class="stage-info">
                        <div class="chapter-selector">
                            <button id="prev-chapter-btn" class="chapter-btn" style="display: none;">◀</button>
                            <h3 id="chapter-title">第一章：方塊森林</h3>
                            <button id="next-chapter-btn" class="chapter-btn" style="display: none;">▶</button>
                        </div>
                        <p id="best-run-stats">尚未有紀錄</p>
                    </div>
                    <button id="start-btn">開始戰鬥</button>
                </div>
                <div id="last-run-stats" class="last-stats"></div>
            </div>

            <div id="tab-upgrade" class="tab-content" style="display: none;">
                <h1 class="game-title">強化</h1>
                <div class="upgrade-container">
                    <div class="upgrade-card">
                        <div class="upgrade-icon"></div>
                        <div class="upgrade-info">
                            <span class="lvl-tag">Lv.<span id="cube-lvl-display">1</span></span>
                            <h4>核心屬性強化</h4>
                            <p>攻擊 +<span id="atk-bonus">0</span> | 血量 +<span id="hp-bonus">0</span></p>
                        </div>
                        <button id="upgrade-cube-btn">升級<br><small>💰<span id="upgrade-cost-display">500</span></small></button>
                    </div>
                </div>
            </div>
            
            <div id="tab-equip" class="tab-content" style="display: none;">
                <h1 class="game-title">裝備</h1>
                <div class="equip-stats" id="equip-stats"></div>
                <div class="equip-grid" id="equipped-slots"></div>
                <h3 style="margin-top:20px; color:var(--primary); text-align:center;">背包</h3>
                <div class="inventory-grid" id="inventory-list"></div>
            </div>
            
            <div id="tab-trial" class="tab-content" style="display: none;">
                <h1 class="game-title">試煉</h1>
                <div class="trial-container">
                    <button class="trial-card" id="show-sniper-trial-btn">
                        <h4>狙擊手試煉 <span class="trial-lvl-badge">Lv.<span id="sniper-trial-lvl-display">1</span></span></h4>
                        <p>直接挑戰強大的狙擊手頭目，測試你的極限。</p>
                        <span class="trial-reward-text">點擊查看獎勵與詳情</span>
                    </button>
                    <button class="trial-card" id="show-octopus-trial-btn">
                        <h4>八爪魚試煉 <span class="trial-lvl-badge">Lv.<span id="octopus-trial-lvl-display">1</span></span></h4>
                        <p>面對深淵八爪魚的彈幕與吸血衝擊波生存下來。</p>
                        <span class="trial-reward-text">點擊查看獎勵與詳情</span>
                    </button>
                    <button class="trial-card" id="show-chase-trial-btn">
                        <h4>追擊試煉 <span class="trial-lvl-badge">Lv.<span id="chase-trial-lvl-display">1</span></span></h4>
                        <p>在大量衝鋒方塊的圍剿下生存下來。</p>
                        <span class="trial-reward-text">點擊查看獎勵與詳情</span>
                    </button>
                </div>
            </div>

        </div>

        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('battle')">
                <span>戰役</span>
            </div>
            <div class="nav-item" onclick="switchTab('upgrade')">
                <span>強化</span>
            </div>
            <div class="nav-item" onclick="switchTab('equip')">
                <span>裝備</span>
            </div>
            <div class="nav-item" onclick="switchTab('trial')">
                <span>試煉</span>
            </div>
        </div>
    </div>
    
    <div id="item-modal" class="popup-screen" style="display:none;">
        <div class="popup-container">
            <h2 class="popup-title" id="item-modal-name">裝備名稱</h2>
            <p class="popup-desc" id="item-modal-stats">屬性...</p>
            <div class="popup-actions">
                <button id="item-modal-equip-btn" class="option-btn" style="text-align: center;">裝備</button>
                <button id="item-modal-craft-btn" class="option-btn" style="text-align: center; display: none;">合成更高階</button>
                <button id="item-modal-close-btn" class="option-btn danger-btn" style="text-align: center; margin-top: 10px;">關閉</button>
            </div>
        </div>
    </div>

    <div id="sniper-trial-screen" class="popup-screen" style="display: none;">
        <div class="popup-container">
            <h2 class="popup-title">狙擊手挑戰</h2>
            <p class="popup-desc" id="sniper-trial-desc"></p>
            <div class="popup-actions">
                <button id="start-sniper-trial-btn" class="option-btn" style="text-align: center;">挑戰</button>
                <button id="close-sniper-trial-btn" class="option-btn danger-btn" style="text-align: center; margin-top: 10px;">返回</button>
            </div>
        </div>
    </div>

    <div id="octopus-trial-screen" class="popup-screen" style="display: none;">
        <div class="popup-container">
            <h2 class="popup-title">八爪魚挑戰</h2>
            <p class="popup-desc" id="octopus-trial-desc"></p>
            <div class="popup-actions">
                <button id="start-octopus-trial-btn" class="option-btn" style="text-align: center;">挑戰</button>
                <button id="close-octopus-trial-btn" class="option-btn danger-btn" style="text-align: center; margin-top: 10px;">返回</button>
            </div>
        </div>
    </div>

    <div id="chase-trial-screen" class="popup-screen" style="display: none;">
        <div class="popup-container">
            <h2 class="popup-title">追擊挑戰</h2>
            <p class="popup-desc" id="chase-trial-desc"></p>
            <div class="popup-actions">
                <button id="start-chase-trial-btn" class="option-btn" style="text-align: center;">挑戰</button>
                <button id="close-chase-trial-btn" class="option-btn danger-btn" style="text-align: center; margin-top: 10px;">返回</button>
            </div>
        </div>
    </div>

    <div id="level-up" style="display: none;">
        <h2 class="upgrade-title">升級選擇</h2>
        <div id="options-container" class="option-column"></div>
    </div>

    <div id="pause-menu" style="display: none;">
        <div class="pause-container">
            <h2 class="pause-title">遊戲暫停</h2>
            
            <div class="pause-upgrades-section">
                <h3>已獲得升級</h3>
                <div id="acquired-upgrades-list">
                    <!-- 動態注入已獲得的升級清單 -->
                </div>
            </div>

            <div class="pause-actions">
                <button id="resume-btn" class="option-btn" style="text-align: center;">繼續遊戲</button>
                <button id="restart-btn" class="option-btn" style="text-align: center;">重新開始</button>
                <button id="end-battle-btn" class="option-btn danger-btn">結束戰鬥<br><small>(僅獲得 1/4 獎勵)</small></button>
            </div>
        </div>
    </div>

    <div id="death-screen">
        <div id="death-banner" class="death-banner">你已死亡</div>
        <div id="win-banner" class="win-banner" style="display: none;">戰役完勝</div>
    </div>

    <div id="enemy-banner">
        <div class="banner-content">
            <div class="banner-subtitle">警告：偵測到新威脅</div>
            <div id="enemy-name" class="banner-title"></div>
            <div id="enemy-desc" class="banner-desc"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <!-- 分割後的 JS 檔案 -->
    <script src="js/dom-elements.js" defer></script>
    <script src="js/game-state.js" defer></script>
    <script src="js/ui-handler.js" defer></script>
    <script src="js/game-logic.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
